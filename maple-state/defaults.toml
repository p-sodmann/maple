# Maple — default settings
# This file is written to ~/.config/maple/settings.toml on first launch.
# Edit it to customise Maple's behaviour.

# Debug mode — when true, aligned face crops (112×112 px) are saved to
# ~/.config/maple/aligned_faces/ after each detection pass.
debug = false

# Number of full-resolution images to keep buffered around the current
# image in the browser view.
preview_buffer_size = 21

# Directory where library data files are stored
# (seen_imported.bin, seen_rejected.bin, …).
# Defaults to ~/.config/maple/ when left empty.
library_dir = ""

# Path to the SQLite library database.
# Defaults to ~/.config/maple/library.db when left empty.
database_path = ""

# ── Destination path template ───────────────────────────────────
# Controls how imported files are organised on disk. Both use {TOKEN}
# placeholders resolved from the file's EXIF capture date (falls back to
# its filesystem modified time when there's no EXIF date):
#   {YYYY} {YY} {MM} {DD} {hh} {mm} {ss}   — date/time
#   {original}  — source filename, no extension
#   {counter}   — 1-based index within this import, zero-padded to 4 digits
#   {camera}    — EXIF Make+Model, when present
# The original file extension is always preserved regardless of `filename`.

[path_template]
# Subfolder path under the destination, "/"-separated. "" = flat copy.
folder = "{YYYY}/{MM}"

# Filename stem. "{original}" keeps the source filename unchanged.
filename = "{original}"

# ── Import scan ─────────────────────────────────────────────────
# The scan reads the medium on one thread and decodes on several. That is
# deliberate: a camera card is a single bus, and several readers on it are
# slower than one, not faster — twelve threads each get a twelfth of the
# bandwidth and the grid stays empty until they all finish at once.

[import]
# Photos decoded in parallel. Minimum 1.
# Each worker holds one full-resolution frame while it works (a 24 MP photo
# is about 72 MB), so this is a memory dial as much as a speed one. The
# default is low on purpose: a scan exists to be looked through, and nobody
# triages photos faster than four cores can produce them. Raise it for a
# fast internal disk and a lot of cores.
decode_threads = 4

# Seconds one photo gets to be read off the medium before the scan gives up
# on it and moves on to the next.
# The backstop for a card that has stopped answering — without it, one file
# that never returns stalls the whole scan. A photo that times out is still
# listed and still copyable, it just has no preview, and its full path is
# logged under the `maple::import::unreadable` target.
read_timeout_secs = 30

# Decoded previews held in memory at once. Minimum 16.
# A 256 px preview is about 196 KB decoded, so the default is roughly 25 MB.
# The scan only decodes what is near the part of the strip you are looking
# at; past this ceiling the preview you have not looked at for longest is
# dropped down to a WebP copy of itself (~15 KB) and re-inflated from there
# if you scroll back to it, so eviction never sends the app back to the card.
max_loaded_previews = 128

# ── AI image description ────────────────────────────────────────

[ai]
# Whether the AI tagger starts automatically when the library opens.
enabled = false

# Base URL of the OpenAI-compatible server.
server_url = "http://localhost:1234"

# Model identifier as the server expects it.
model = "local-model"

# System prompt sent with every image.
prompt = "Describe this image in detail. Include the main subjects, scene, colors, mood, any text visible, and notable elements. Be thorough to enable comprehensive search results."

# ── Face detection / recognition ────────────────────────────────

[face]
# Whether the face tagger starts automatically when the library opens.
enabled = false

# Face detector backend.
# "atksh" — single-pass model (detection + landmarks + aligned crops).
#            Download from https://github.com/atksh/onnx-facial-lmk-detector/releases
# "scrfd"  — standard InsightFace SCRFD model (e.g. scrfd_10g_bnkps.onnx).
#            Download from https://github.com/deepinsight/insightface/tree/master/model_zoo
detector_type = "atksh"

# Path to the detector ONNX model (required).
detector_model = ""

# Path to an ArcFace ONNX embedder (optional — enables person grouping).
# Download from https://github.com/deepinsight/insightface/tree/master/model_zoo
# Leave empty to run detection without embedding.
embedder_model = ""

# Cosine-similarity threshold for suggesting a person match (0.0–1.0).
# ArcFace-R100: same person typically >= 0.40.
similarity_threshold = 0.40

# Number of suggested persons shown in tagging mode.
tagging_top_k = 5

# Execution device for ONNX inference.
# Accepts: "cpu" (default), "cuda:N" (NVIDIA GPU), "tensorrt:N".
device = "cpu"

# ── Collections ────────────────────────────────────────────────

[collections]
# Key to add the current detail-view image to the last-used collection.
# Uses GTK key names (e.g. "a", "f", "space").
add_hotkey = "a"

# ── Thumbnail cache ─────────────────────────────────────────────
# Thumbnails are stored as lossy WebP in an LMDB cache alongside the database.
# The cache is keyed by the image's BLAKE3 content hash, so it invalidates
# automatically when a file is replaced or rotated (EXIF write changes content).

[thumbnails]
# WebP lossy quality for cached previews (0 = smallest, 100 = best).
# 80 is a good balance between file size and visual quality.
quality = 80

# Thumbnail longest-edge size in pixels.
# Larger values = sharper grid cells at the cost of more cache space.
# Changing this clears the thumbnail cache automatically.
size = 200

# ── Session detection ───────────────────────────────────────────
# During an import scan, photos are grouped into "sessions" — one sitting of
# shooting, e.g. twenty pictures of a child in one room over four minutes.
# This is segmentation, not clustering: the scan walks the card in capture
# order and asks at each photo whether the scene changed *here*, so a session
# has two ends and a slow pan cannot chain one into a 200-photo group.
#
# Tune these with the lab, which shows what each engine costs and where each
# one cuts on your own photos:
#   cargo run --release -p maple-db --bin session-lab -- <dir> --out /tmp/s.html

[sessions]
# Whether the import scan groups photos into sessions at all.
enabled = true

# Which engine decides "the scene changed". One name, or a weighted ensemble.
#   block-tile      fraction of the frame that held still — built for a
#                   moving subject in a fixed scene. Blind to colour.
#   grid-histogram  colour and where it sits in the frame.
#   color-kmeans    the palette only, blind to where any of it is.
#   time-gap        votes on the clock alone, interpolated in log time.
# The default weighs the two pixel engines that agree at 0.95 boundary-F1
# against each other, plus the clock.
engine = "block-tile=2,grid-histogram=1,time-gap=1"

# Distance above which the scene counts as changed. 0 = use whatever this
# engine considers its own threshold.
#
# Leave this at 0 unless you have tuned against your own photos. Engine
# distances are NOT comparable to each other — 0.35 means something different
# to every one of them, so a number carried over from another engine is
# meaningless rather than merely wrong.
cut = 0.0

# A gap this long always ends a session, whatever the pixels say (seconds).
hard_gap_secs = 1800.0

# How many non-matching frames in a row a session may absorb before it really
# has ended. One shot of the cake in the middle of twenty of the child is
# bridged when the next frame comes back.
max_outliers = 1

# How much further a photo may drift from the frame its session *started* on
# than from its immediate neighbour. The anti-chaining rule: without it a slow
# pan walks a session across a whole room one tolerable step at a time.
anchor_factor = 1.8

# ── Stack detection ─────────────────────────────────────────────
# After each import batch, newly copied images are compared using dense
# DINOv2 vision embeddings and similar shots are grouped into stacks.  The
# library shows each stack as one tile with a count badge so burst duplicates
# and near-identical shots don't clutter the grid.

[stacks]
# Whether stack detection runs automatically after each import batch.
enabled = false

# Cosine-similarity threshold (0.0–1.0) between image embeddings.
# Images ≥ this value are stacked together.
threshold = 0.90

# HuggingFace repo id of the ONNX vision model.
# The repo must contain an ONNX export at the path given by onnx_file.
model_repo = "onnx-community/dinov2-small"

# Path of the ONNX file within the repo.
onnx_file = "onnx/model.onnx"

# Resize so the shortest edge equals this value, then center-crop to image_size.
# Should match the model's preprocessing config (BitImageProcessor defaults).
shortest_edge = 256
image_size = 224

# ImageNet normalisation parameters (match the model's preprocessor_config.json).
image_mean = [0.485, 0.456, 0.406]
image_std  = [0.229, 0.224, 0.225]

# Execution device for ONNX inference.
# Accepts: "cpu" (default), "cuda:N" (NVIDIA GPU), "tensorrt:N".
device = "cpu"

# ── Semantic search ─────────────────────────────────────────────
# Encodes each sentence of every AI description into a vector with a
# sentence-transformer and stores it in a sqlite-vec table.  Search then ranks
# images by vector distance and merges those hits with keyword results.

[semantic]
# Whether the sentence embedder loads eagerly when the library opens.
# Either way, the model also loads automatically on the first search (and can
# be started/stopped manually with the "Build Semantic Index" button).
enabled = false

# HuggingFace repo id of the sentence-transformer model.  The ONNX model and
# tokenizer are downloaded automatically and cached under ~/.config/maple/models/.
#   "sentence-transformers/all-MiniLM-L6-v2"  — 384-dim, fast (default)
#   "sentence-transformers/all-mpnet-base-v2" — 768-dim, higher quality
# Changing the model rebuilds the vector index from scratch.
model = "sentence-transformers/all-MiniLM-L6-v2"

# Paths of the model + tokenizer files within the repo (standard layout).
onnx_file = "onnx/model.onnx"
tokenizer_file = "tokenizer.json"

# Execution device for ONNX inference.
# Accepts: "cpu" (default), "cuda:N" (NVIDIA GPU), "tensorrt:N".
device = "cpu"

# How many nearest sentence vectors to retrieve per query before merging.
knn_k = 200

# ── Sync ────────────────────────────────────────────────────────
# Library sync between a master installation and its servants.
#
# Only machine configuration lives here. This device's *role* (off / master /
# servant), its display name, and each paired device's file mode (full /
# partial / relay) are stored in the library database instead, so they stay
# transactional with the rows they describe — set them in Settings → Sync.
# Pairing keys live in sync_trust.json, never in this file.

[sync]
# Address the master's sync listener binds to.  0.0.0.0 accepts connections on
# every interface; narrow it to one LAN address if you prefer.  Port 7645 is
# unassigned by IANA.  Ignored unless this device's role is "master".
listen_addr = "0.0.0.0:7645"

# Seconds between sync passes on a servant.  A failed pass retries sooner, on a
# 1 → 2 → 5 → 15 → 30 → 60 second backoff, so this is the *idle* cadence.
interval_secs = 300
