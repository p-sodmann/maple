[package]
name = "maple-ui"
version.workspace = true
edition.workspace = true

[dependencies]
maple-state = { path = "../maple-state" }
maple-import = { path = "../maple-import" }
maple-db = { path = "../maple-db", default-features = false }
maple-sync = { path = "../maple-sync", default-features = false }
slint = { workspace = true }
rfd = { workspace = true }
open = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
webp = { workspace = true }
kamadak-exif = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
directories = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The pairing controller's tests need a reproducible byte stream;
# maple-sync's own seeded source is private to that crate.
blake3 = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "image_pipeline"
harness = false

[features]
default = ["cpu"]
cpu = ["maple-db/cpu", "maple-sync/cpu"]
gpu = ["maple-db/gpu", "maple-sync/gpu"]
