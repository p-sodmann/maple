[package]
name = "maple"
version.workspace = true
edition.workspace = true

[dependencies]
maple-ui = { path = "../maple-ui", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["cpu"]
# See maple-db/Cargo.toml for what each backend needs at build/run time.
cpu = ["maple-ui/cpu"]
gpu = ["maple-ui/gpu"]
