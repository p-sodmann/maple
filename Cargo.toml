[workspace]
resolver = "2"
members = [
    "maple",
    "maple-ui",
    "maple-embed",
    "maple-cluster",
    "maple-tournament",
    "maple-import",
    "maple-state",
    "maple-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# UI — Slint (Rust-native, ships its own GPU renderer; no system GTK runtime).
# backend-winit + renderer-femtovg keeps the build free of system Skia/GTK deps.
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
slint-build = "1.17"

# Native file dialogs — xdg-portal backend (NOT the default GTK3 backend) keeps
# the Linux build GTK-free; xdg-portal pulls in pollster to drive the portal
# calls off the main loop (replaces the async-std backend rfd dropped in 0.16).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# Open files/URLs in the platform's default application (external-app launch).
open = "5"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros"] }

# ONNX Runtime (ort 2.x — supports CPU, CUDA, TensorRT via execution providers).
# Backend is chosen via maple-db's `cpu` (default) / `gpu` Cargo features, not
# here — see maple-db/Cargo.toml for the two feature sets and CLAUDE.md for how
# to build each variant. default-features = false so neither backend leaks in
# by accident.
ort = { version = "=2.0.0-rc.12", default-features = false }

# Image
image = "0.25"
fast_image_resize = "6"
kamadak-exif = "0.6"
zune-jpeg = "0.5"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Data
ndarray = "0.17.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
blake3 = "1"

# Semantic search
# sqlite-vec: bundled vec0 virtual-table extension for vector KNN / distance.
sqlite-vec = "0.1"
# hf-hub: blocking (ureq) HuggingFace Hub downloader — no tokio, matches the
# std::thread architecture.  rustls keeps TLS pure-Rust (no system openssl).
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
# tokenizers: load tokenizer.json and encode text.  default-features = false
# drops the optional progressbar/onig C deps and the (already-off) `http`
# feature, so no reqwest/tokio is pulled in.  fancy-regex is the pure-Rust
# regex backend (required by the tokenizer; avoids the oniguruma C build).
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# HTTP (blocking, for AI API calls)
ureq = { version = "3", features = ["json"] }

# Thumbnail cache
redb = "4"
webp = "0.3"

# Encoding
base64 = "0.22"

# Platform directories
directories = "6"

# Cross-platform path normalisation (forward-slash UTF-8 for SQLite storage)
path-slash = "0.2"

# Testing
tempfile = "3"
